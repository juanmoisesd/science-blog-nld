<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Científico - Dr. Juan Moisés de la Serna</title>
    <style>
        :root {
            --bg-color: #0a0a12;
            --text-color: #e0e0e0;
            --accent-color: #4a90e2;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h1 {
            color: var(--accent-color);
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        p {
            line-height: 1.6;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 10px;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn:hover {
            background-color: #357abd;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Blog Científico</h1>
        <p>Explorando las fronteras de la neuroplasticidad y la dinámica social. Artículos de alta divulgación científica por el Dr. Juan Moisés de la Serna.</p>
        <div class="links">
            <a href="articulos/polarizacion-social.html" class="btn">Simulación: Polarización Social</a>
        </div>
    </div>
</body>
</html>
